name: Flight Price Monitor

on:
  schedule:
    # 每天 09:47 台灣時間（UTC+8 → UTC 01:47）
    # 避開整點：GitHub Actions 整點壅塞，容易 delay 或 skip
    - cron: '47 1 * * *'
  workflow_dispatch:   # 也可手動在 Actions 頁面觸發

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許 commit 回 history.json
      issues: write     # 允許在票價達標時建立 Issue 通知

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run price tracker
        id: scan
        run: |
          cd 價格追蹤
          python3 track.py 2>&1 | tee /tmp/scan_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit updated history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 價格追蹤/history.json
          # 只在有變動時 commit（避免空 commit）
          git diff --staged --quiet || \
            git commit -m "auto: price scan $(date -u '+%Y-%m-%d') [skip ci]"
          git push

      - name: Check alert thresholds and create issue if triggered
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 讀取最新 history
            const history = JSON.parse(
              fs.readFileSync('價格追蹤/history.json', 'utf8')
            );
            const targets = JSON.parse(
              fs.readFileSync('價格追蹤/targets.json', 'utf8')
            );

            const alerts = [];
            for (const t of targets) {
              if (t.type !== 'open_jaw') continue;
              const records = history[t.id];
              if (!records || records.length === 0) continue;

              const latest  = records[records.length - 1];
              const threshold = t.alert_threshold;
              if (!threshold || latest.price > threshold) continue;

              // 觸發警報！
              alerts.push(
                `**${t.name}**\n` +
                `- 合計票價：TWD ${latest.price.toLocaleString()}（目標 ≤ TWD ${threshold.toLocaleString()}）\n` +
                `- 去程：${latest.inbound.airline} ${latest.inbound.flight_no}  ` +
                  `${latest.depart_date}  ${latest.inbound.dep}→${latest.inbound.arr}  ` +
                  `TWD ${latest.inbound.price.toLocaleString()}\n` +
                `- 回程：${latest.outbound.airline} ${latest.outbound.flight_no}  ` +
                  `${latest.return_date}  ${latest.outbound.dep}→${latest.outbound.arr}  ` +
                  `TWD ${latest.outbound.price.toLocaleString()}`
              );
            }

            if (alerts.length === 0) {
              console.log('No alerts triggered.');
              return;
            }

            // 建立 GitHub Issue 通知（GitHub 會發信給 watch 的人）
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `✈️ 票價警報 ${today}：開口票已達目標價`,
              body:  alerts.join('\n\n---\n\n') +
                     '\n\n> 此 Issue 由 GitHub Actions 自動建立。確認後可關閉。',
              labels: ['price-alert'],
            });
            console.log('Alert issue created!');

      - name: Send Discord summary
        if: always()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone

          bot_token  = os.environ.get("DISCORD_BOT_TOKEN", "")
          channel_id = os.environ.get("DISCORD_CHANNEL_ID", "")
          if not bot_token or not channel_id:
              print("DISCORD_BOT_TOKEN or DISCORD_CHANNEL_ID not set, skipping.")
              exit(0)

          history = json.load(open("價格追蹤/history.json", encoding="utf-8"))
          targets = json.load(open("價格追蹤/targets.json", encoding="utf-8"))
          today   = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          fields = []
          alert_names = []

          for t in targets:
              tid     = t["id"]
              records = history.get(tid, [])
              if not records:
                  continue
              latest    = records[-1]
              price     = latest["price"]
              threshold = t.get("alert_threshold")
              is_oj     = t.get("type") == "open_jaw"

              if is_oj:
                  inb = latest["inbound"]
                  out = latest["outbound"]
                  detail = (
                      f"去程 {inb['flight_no']} {latest['depart_date']} "
                      f"{inb['dep']}→{inb['arr']} TWD {inb['price']:,}\n"
                      f"回程 {out['flight_no']} {latest['return_date']} "
                      f"{out['dep']}→{out['arr']} TWD {out['price']:,}"
                  )
              else:
                  detail = (
                      f"{latest['airline']} {latest['flight_no']}  "
                      f"{latest['dep']}→{latest['arr']}  {latest.get('rating','')}"
                  )

              hit_threshold = threshold and price <= threshold
              if hit_threshold:
                  alert_names.append(t["name"])
                  label = f"🔥 TWD {price:,}  ← 已達目標 ≤{threshold:,}！"
              else:
                  label = f"TWD {price:,}" + (f"  (目標 ≤{threshold:,})" if threshold else "")

              fields.append({
                  "name": t["name"],
                  "value": f"{label}\n{detail}",
                  "inline": False,
              })

          title  = f"✈️ 票價日報 {today}"
          color  = 0xFF4444 if alert_names else 0x5865F2

          if alert_names:
              description = "🚨 **警報觸發！以下路線已達目標價：**\n" + "\n".join(f"• {n}" for n in alert_names)
          else:
              description = "今日掃描完成，尚無路線達目標價。"

          payload = {
              "embeds": [{
                  "title":       title,
                  "description": description,
                  "color":       color,
                  "fields":      fields,
                  "footer":      {"text": "jp_travel price monitor"},
                  "timestamp":   datetime.now(timezone.utc).isoformat(),
              }]
          }

          url  = f"https://discord.com/api/v10/channels/{channel_id}/messages"
          body = json.dumps(payload).encode("utf-8")
          req  = urllib.request.Request(
              url,
              data    = body,
              headers = {
                  "Content-Type":  "application/json",
                  "Authorization": f"Bot {bot_token}",
              },
              method  = "POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Discord notified: HTTP {resp.status}")
          except urllib.error.HTTPError as e:
              print(f"Discord API error: {e.code} {e.read().decode()}")
              exit(1)
          PYEOF
