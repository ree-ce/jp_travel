name: Flight Price Monitor

on:
  schedule:
    # 每天 02:07 & 14:07 台灣時間（UTC+8 → UTC 18:07 / 06:07）
    # 避開整點：GitHub Actions 整點壅塞，容易 delay 或 skip
    # - cron: '7 18 * * *'
    # - cron: '7 6 * * *'
  workflow_dispatch:   # 也可手動在 Actions 頁面觸發

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許 commit 回 history.json
      issues: write     # 允許在票價達標時建立 Issue 通知

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run price tracker
        id: scan
        run: |
          cd 價格追蹤
          python3 track.py 2>&1 | tee /tmp/scan_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit updated history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 價格追蹤/history.json
          # 只在有變動時 commit（避免空 commit）
          git diff --staged --quiet || \
            git commit -m "auto: price scan $(date -u '+%Y-%m-%d') [skip ci]"
          git push

      - name: Check alert thresholds and create issue if triggered
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const history = JSON.parse(
              fs.readFileSync('價格追蹤/history.json', 'utf8')
            );
            const targets = JSON.parse(
              fs.readFileSync('價格追蹤/targets.json', 'utf8')
            );

            const alerts = [];
            for (const t of targets) {
              if (t.type !== 'open_jaw') continue;
              const records = history[t.id];
              if (!records || records.length === 0) continue;

              const latest    = records[records.length - 1];
              const threshold = t.alert_threshold;
              if (!threshold || latest.price > threshold) continue;

              // Support both canonical (out_flight_no) and old (inbound.flight_no) formats
              const outFn  = latest.out_flight_no  || (latest.inbound  || {}).flight_no  || '?';
              const outDep = latest.out_dep         || (latest.inbound  || {}).dep         || '';
              const outArr = latest.out_arr         || (latest.inbound  || {}).arr         || '';
              const outP   = latest.out_price       || (latest.inbound  || {}).price       || 0;
              const outAl  = latest.out_airline     || (latest.inbound  || {}).airline     || '';
              const retFn  = latest.ret_flight_no   || (latest.outbound || {}).flight_no  || '?';
              const retDep = latest.ret_dep         || (latest.outbound || {}).dep         || '';
              const retArr = latest.ret_arr         || (latest.outbound || {}).arr         || '';
              const retP   = latest.ret_price       || (latest.outbound || {}).price       || 0;
              const retAl  = latest.ret_airline     || (latest.outbound || {}).airline     || '';

              alerts.push(
                `**${t.name}**\n` +
                `- 合計票價：TWD ${latest.price.toLocaleString()}（目標 ≤ TWD ${threshold.toLocaleString()}）\n` +
                `- 去程：${outAl} ${outFn}  ` +
                  `${latest.depart_date}  ${outDep}→${outArr}  ` +
                  `TWD ${outP.toLocaleString()}\n` +
                `- 回程：${retAl} ${retFn}  ` +
                  `${latest.return_date}  ${retDep}→${retArr}  ` +
                  `TWD ${retP.toLocaleString()}`
              );
            }

            if (alerts.length === 0) {
              console.log('No alerts triggered.');
              return;
            }

            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `✈️ 票價警報 ${today}：開口票已達目標價`,
              body:  alerts.join('\n\n---\n\n') +
                     '\n\n> 此 Issue 由 GitHub Actions 自動建立。確認後可關閉。',
              labels: ['price-alert'],
            });
            console.log('Alert issue created!');

      - name: Send Telegram summary
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error, urllib.parse
          from datetime import date, datetime, timezone, timedelta

          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id   = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not bot_token or not chat_id:
              print("TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set, skipping.")
              exit(0)

          history = json.load(open("價格追蹤/history.json", encoding="utf-8"))
          targets = json.load(open("價格追蹤/targets.json", encoding="utf-8"))

          # 台灣時間 UTC+8
          tw_time = datetime.now(timezone(timedelta(hours=8)))
          timestamp = tw_time.strftime("%Y-%m-%d %H:%M")

          RATING_LABEL = {
              "超值":     "🔥 [1/6] 超值",
              "便宜":     "✅ [2/6] 便宜",
              "一般偏低": "🟡 [3/6] 一般偏低",
              "一般":     "➖ [4/6] 一般",
              "偏高":     "🔺 [5/6] 偏高",
              "高":       "❌ [6/6] 高",
          }

          def normalize_snapshot(snap, ttype):
              """Map any snapshot (old or new format) to the canonical 16-field schema."""
              if "out_flight_no" in snap:
                  return snap
              if ttype == "open_jaw":
                  inb = snap.get("inbound", {})
                  out = snap.get("outbound", {})
                  return {
                      "checked_at": snap["checked_at"], "price": snap["price"],
                      "depart_date": snap.get("depart_date"), "return_date": snap.get("return_date"),
                      "out_airline": inb.get("airline"), "out_flight_no": inb.get("flight_no"),
                      "out_dep": inb.get("dep"), "out_arr": inb.get("arr"), "out_price": inb.get("price"),
                      "ret_airline": out.get("airline"), "ret_flight_no": out.get("flight_no"),
                      "ret_dep": out.get("dep"), "ret_arr": out.get("arr"), "ret_price": out.get("price"),
                      "rating": None, "google_low": None,
                  }
              if ttype == "oneway":
                  return {
                      "checked_at": snap["checked_at"], "price": snap["price"],
                      "depart_date": snap.get("depart_date"), "return_date": None,
                      "out_airline": snap.get("airline"), "out_flight_no": snap.get("flight_no"),
                      "out_dep": snap.get("dep"), "out_arr": snap.get("arr"), "out_price": snap.get("price"),
                      "ret_airline": None, "ret_flight_no": None,
                      "ret_dep": None, "ret_arr": None, "ret_price": None,
                      "rating": None, "google_low": None,
                  }
              # roundtrip old format: flight_no / ret_flight_no / history_min
              return {
                  "checked_at": snap["checked_at"], "price": snap["price"],
                  "depart_date": snap.get("depart_date"), "return_date": snap.get("return_date"),
                  "out_airline": snap.get("airline"), "out_flight_no": snap.get("flight_no"),
                  "out_dep": snap.get("dep"), "out_arr": snap.get("arr"), "out_price": None,
                  "ret_airline": snap.get("ret_airline"), "ret_flight_no": snap.get("ret_flight_no"),
                  "ret_dep": snap.get("ret_dep"), "ret_arr": snap.get("ret_arr"), "ret_price": None,
                  "rating": snap.get("rating"),
                  "google_low": snap.get("history_min") or snap.get("google_low"),
              }

          def oj_rating(price, records):
              prices = [r["price"] for r in records if r.get("price")]
              if len(prices) < 2:
                  return "❓ 資料不足（僅 {} 筆）".format(len(prices))
              atl = min(prices)
              if price <= atl:
                  return "🔥 [1/6] 超值（歷史低點 TWD {:,}）".format(atl)
              gap = (price - atl) / atl
              if gap <= 0.05:   label = "✅ [2/6] 便宜"
              elif gap <= 0.15: label = "🟡 [3/6] 一般偏低"
              elif gap <= 0.30: label = "➖ [4/6] 一般"
              elif gap <= 0.50: label = "🔺 [5/6] 偏高"
              else:             label = "❌ [6/6] 高"
              return "{} （歷史低點 TWD {:,}，差 +{:.0f}%）".format(label, atl, gap * 100)

          def mmdd(iso):
              return iso[5:].replace("-", "/") if iso and len(iso) == 10 else (iso or "")

          def render_group(group_targets):
              lines, alerts = [], []
              for t in group_targets:
                  tid   = t["id"]
                  ttype = t.get("type", "roundtrip")
                  records = history.get(tid, [])
                  if not records:
                      continue
                  norm      = normalize_snapshot(records[-1], ttype)
                  price     = norm["price"]
                  threshold = t.get("alert_threshold")

                  hit = threshold and price <= threshold
                  if hit:
                      alerts.append(t["name"])
                      icon = "🔥"
                      price_line = f"TWD {price:,}  ← 已達目標 ≤{threshold:,}！"
                  else:
                      icon = "➖"
                      price_line = f"TWD {price:,}" + (f"  (目標 ≤{threshold:,})" if threshold else "")

                  lines.append(f"{icon} <b>{t['name']}</b>")
                  lines.append(price_line)

                  # outbound
                  out_fn   = norm.get("out_flight_no") or "?"
                  out_date = mmdd(norm.get("depart_date") or "")
                  out_dep  = norm.get("out_dep") or ""
                  out_arr  = norm.get("out_arr") or ""
                  arr_note = "⚠️" if out_arr == "00:00" else ""
                  lines.append(f"去 {out_fn}  {out_date}  {out_dep}→{out_arr}{arr_note}")

                  # return
                  ret_fn   = norm.get("ret_flight_no")
                  ret_date = mmdd(norm.get("return_date") or "")
                  days     = t.get("days") or t.get("trip_days")
                  days_str = f"  共{days}天" if days and ret_fn else ""
                  if ret_fn:
                      ret_dep = norm.get("ret_dep") or "?"
                      ret_arr = norm.get("ret_arr") or "?"
                      lines.append(f"回 {ret_fn}  {ret_date}  {ret_dep}→{ret_arr}{days_str}")
                  elif ret_date:
                      lines.append(f"回 {ret_date}{days_str}")

                  # rating
                  if ttype == "open_jaw":
                      lines.append(oj_rating(price, records))
                  else:
                      r = norm.get("rating")
                      rating_str = RATING_LABEL.get(r, "") if r else ""
                      google_low = norm.get("google_low")
                      if google_low:
                          rating_str += f"  Google低點 TWD {google_low:,}"
                      if rating_str:
                          lines.append(rating_str)

                  lines.append("")
              return lines, alerts

          def send_tg(text):
              import time
              url  = f"https://api.telegram.org/bot{bot_token}/sendMessage"
              data = urllib.parse.urlencode({
                  "chat_id": chat_id, "text": text, "parse_mode": "HTML",
              }).encode("utf-8")
              for attempt in range(1, 4):
                  req = urllib.request.Request(url, data=data, method="POST")
                  try:
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          print(f"Telegram notified: HTTP {resp.status}")
                          return
                  except urllib.error.HTTPError as e:
                      print(f"Telegram HTTP error: {e.code} {e.read().decode()}")
                      return  # HTTP error (bad token, wrong chat_id…) — no point retrying
                  except urllib.error.URLError as e:
                      wait = 2 ** attempt
                      print(f"Telegram attempt {attempt}/3 failed: {e.reason} — retry in {wait}s")
                      if attempt < 3:
                          time.sleep(wait)
              print("Telegram: all retries exhausted (non-fatal)")

          lcc_targets = [t for t in targets if t.get("tier", "lcc") == "lcc"]
          fsc_targets = [t for t in targets if t.get("tier") == "fsc"]

          lcc_lines, lcc_alerts = render_group(lcc_targets)
          if lcc_lines:
              if lcc_alerts:
                  hdr = f"✈️ <b>廉航票價日報 {timestamp}</b>\n🚨 警報：" + "、".join(lcc_alerts)
              else:
                  hdr = f"✈️ <b>廉航票價日報 {timestamp}</b>\n掃描完成，尚無達目標價。"
              send_tg(hdr + "\n\n" + "\n".join(lcc_lines).strip())

          fsc_lines, fsc_alerts = render_group(fsc_targets)
          if fsc_lines:
              if fsc_alerts:
                  hdr = f"✈️ <b>傳統航空票價日報 {timestamp}</b>\n🚨 警報：" + "、".join(fsc_alerts)
              else:
                  hdr = f"✈️ <b>傳統航空票價日報 {timestamp}</b>\n掃描完成，尚無達目標價。"
              send_tg(hdr + "\n\n" + "\n".join(fsc_lines).strip())
          PYEOF
