name: Flight Price Monitor

on:
  schedule:
    # 每天 02:07 & 14:07 台灣時間（UTC+8 → UTC 18:07 / 06:07）
    # 避開整點：GitHub Actions 整點壅塞，容易 delay 或 skip
    - cron: '7 18 * * *'
    - cron: '7 6 * * *'
  workflow_dispatch:   # 也可手動在 Actions 頁面觸發

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許 commit 回 history.json
      issues: write     # 允許在票價達標時建立 Issue 通知

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run price tracker
        id: scan
        run: |
          cd 價格追蹤
          python3 track.py 2>&1 | tee /tmp/scan_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit updated history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 價格追蹤/history.json
          # 只在有變動時 commit（避免空 commit）
          git diff --staged --quiet || \
            git commit -m "auto: price scan $(date -u '+%Y-%m-%d') [skip ci]"
          git push

      - name: Check alert thresholds and create issue if triggered
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const history = JSON.parse(
              fs.readFileSync('價格追蹤/history.json', 'utf8')
            );
            const targets = JSON.parse(
              fs.readFileSync('價格追蹤/targets.json', 'utf8')
            );

            const alerts = [];
            for (const t of targets) {
              if (t.type !== 'open_jaw') continue;
              const records = history[t.id];
              if (!records || records.length === 0) continue;

              const latest    = records[records.length - 1];
              const threshold = t.alert_threshold;
              if (!threshold || latest.price > threshold) continue;

              alerts.push(
                `**${t.name}**\n` +
                `- 合計票價：TWD ${latest.price.toLocaleString()}（目標 ≤ TWD ${threshold.toLocaleString()}）\n` +
                `- 去程：${latest.inbound.airline} ${latest.inbound.flight_no}  ` +
                  `${latest.depart_date}  ${latest.inbound.dep}→${latest.inbound.arr}  ` +
                  `TWD ${latest.inbound.price.toLocaleString()}\n` +
                `- 回程：${latest.outbound.airline} ${latest.outbound.flight_no}  ` +
                  `${latest.return_date}  ${latest.outbound.dep}→${latest.outbound.arr}  ` +
                  `TWD ${latest.outbound.price.toLocaleString()}`
              );
            }

            if (alerts.length === 0) {
              console.log('No alerts triggered.');
              return;
            }

            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `✈️ 票價警報 ${today}：開口票已達目標價`,
              body:  alerts.join('\n\n---\n\n') +
                     '\n\n> 此 Issue 由 GitHub Actions 自動建立。確認後可關閉。',
              labels: ['price-alert'],
            });
            console.log('Alert issue created!');

      - name: Send Telegram summary
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error, urllib.parse
          from datetime import date, datetime, timezone, timedelta

          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id   = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not bot_token or not chat_id:
              print("TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set, skipping.")
              exit(0)

          history = json.load(open("價格追蹤/history.json", encoding="utf-8"))
          targets = json.load(open("價格追蹤/targets.json", encoding="utf-8"))

          # 台灣時間 UTC+8
          tw_time = datetime.now(timezone(timedelta(hours=8)))
          timestamp = tw_time.strftime("%Y-%m-%d %H:%M")

          RATING_LABEL = {
              "超值":     "🔥 [1/6] 超值",
              "便宜":     "✅ [2/6] 便宜",
              "一般偏低": "🟡 [3/6] 一般偏低",
              "一般":     "➖ [4/6] 一般",
              "偏高":     "🔺 [5/6] 偏高",
              "高":       "❌ [6/6] 高",
          }
          RATING_SCORE = {"超值": 1, "便宜": 2, "一般偏低": 3, "一般": 4, "偏高": 5, "高": 6}
          SCORE_TO_KEY = {v: k for k, v in RATING_SCORE.items()}

          def rt_effective_rating(price, raw_rating, history_min):
              if not history_min or price <= history_min:
                  return raw_rating
              gap = (price - history_min) / history_min
              google_score = RATING_SCORE.get(raw_rating, 4)
              if gap > 0.15:
                  floor_score = 3
              elif gap > 0.05:
                  floor_score = 2
              else:
                  return raw_rating
              return SCORE_TO_KEY[max(google_score, floor_score)]

          def oj_rating(price, records):
              prices = [r["price"] for r in records if r.get("price")]
              if len(prices) < 2:
                  return "❓ 資料不足（僅 {} 筆）".format(len(prices))
              atl = min(prices)
              if price <= atl:
                  return "🔥 [1/6] 超值（歷史低點 TWD {:,}）".format(atl)
              gap = (price - atl) / atl
              if gap <= 0.05:
                  label = "✅ [2/6] 便宜"
              elif gap <= 0.15:
                  label = "🟡 [3/6] 一般偏低"
              elif gap <= 0.30:
                  label = "➖ [4/6] 一般"
              elif gap <= 0.50:
                  label = "🔺 [5/6] 偏高"
              else:
                  label = "❌ [6/6] 高"
              return "{} （歷史低點 TWD {:,}，差 +{:.0f}%）".format(label, atl, gap * 100)

          lines = []
          alert_names = []

          for t in targets:
              tid     = t["id"]
              records = history.get(tid, [])
              if not records:
                  continue
              latest    = records[-1]
              price     = latest["price"]
              is_oj     = t.get("type") == "open_jaw"
              threshold = t.get("alert_threshold")

              hit = threshold and price <= threshold
              if hit:
                  alert_names.append(t["name"])
                  icon = "🔥"
                  price_line = f"TWD {price:,}  ← 已達目標 ≤{threshold:,}！"
              else:
                  icon = "➖"
                  price_line = f"TWD {price:,}" + (f"  (目標 ≤{threshold:,})" if threshold else "")

              lines.append(f"{icon} <b>{t['name']}</b>")
              lines.append(price_line)

              def mmdd(iso):
                  return iso[5:].replace("-", "/") if iso and len(iso) == 10 else (iso or "")

              if is_oj:
                  inb = latest["inbound"]
                  out = latest["outbound"]
                  lines.append(f"去 {inb['flight_no']}  {mmdd(latest['depart_date'])}  {inb['dep']}→{inb['arr']}  {inb['price']:,}")
                  lines.append(f"回 {out['flight_no']}  {mmdd(latest['return_date'])}  {out['dep']}→{out['arr']}  {out['price']:,}")
                  lines.append(oj_rating(price, records))
              else:
                  depart_date = t.get("depart_date", "")
                  days        = t.get("days")
                  # prefer stored return_date; fall back to depart + days
                  return_date = latest.get("return_date") or (
                      (date.fromisoformat(depart_date) + timedelta(days=days)).isoformat()
                      if depart_date and days else ""
                  )
                  raw_rating  = latest.get("rating", "")
                  history_min = latest.get("history_min")
                  eff_rating  = rt_effective_rating(price, raw_rating, history_min)
                  rating_str  = RATING_LABEL.get(eff_rating, "")
                  arr         = latest['arr']
                  arr_note    = "⚠️" if arr == "00:00" else ""
                  google_low  = history_min
                  google_str  = f"  Google低點 TWD {google_low:,}" if google_low else ""
                  days_str    = f"  共{days}天" if days else ""
                  out_line    = f"去 {latest['flight_no']}  {mmdd(depart_date)}  {latest['dep']}→{arr}"
                  if arr_note:
                      out_line += arr_note
                  lines.append(out_line)
                  ret_fn = latest.get("ret_flight_no")
                  if ret_fn:
                      ret_dep   = latest.get("ret_dep", "?")
                      ret_arr_t = latest.get("ret_arr", "?")
                      lines.append(f"回 {ret_fn}  {mmdd(return_date)}  {ret_dep}→{ret_arr_t}{days_str}")
                  else:
                      lines.append(f"回 {mmdd(return_date)}{days_str}")
                  if rating_str or google_str:
                      lines.append(f"{rating_str}{google_str}")
              lines.append("")

          if alert_names:
              header = f"✈️ <b>票價日報 {timestamp} (台灣時間)</b>\n🚨 警報觸發：" + "、".join(alert_names)
          else:
              header = f"✈️ <b>票價日報 {timestamp} (台灣時間)</b>\n今日掃描完成，尚無路線達目標價。"

          text = header + "\n\n" + "\n".join(lines).strip()

          url  = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id":    chat_id,
              "text":       text,
              "parse_mode": "HTML",
          }).encode("utf-8")
          req = urllib.request.Request(url, data=data, method="POST")
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Telegram notified: HTTP {resp.status}")
          except urllib.error.HTTPError as e:
              print(f"Telegram error: {e.code} {e.read().decode()}")
              exit(1)
          PYEOF
